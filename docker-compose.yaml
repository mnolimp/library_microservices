services:
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - lib-net
  postgres-library:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: library_db
    ports:
      - "5432:5432" 
    volumes:
      - postgres-library-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d library_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lib-net

  gateway:
    build: ./gateway/nginx
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    depends_on:
      - catalog-service
      - user-service
      - lending-service
      - digital-service
    networks:
      - lib-net

  catalog-service:
    build: ./services/catalog-service
    ports:
      - "${CATALOG_PORT:-8001}:8000"
      - "8001:8000"
      - "50051:50051"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-library:5432/library_db
      - SCHEMA=catalog
    depends_on:
      postgres-library:
        condition: service_healthy
    networks:
      - lib-net

  user-service:
    build: ./services/user-service
    ports:
      - "${USER_PORT:-8002}:8000"
      - "8002:8000"
      - "50052:50052"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-library:5432/library_db
      - SCHEMA=users
    depends_on:
      postgres-library:
        condition: service_healthy
    networks:
      - lib-net

  lending-service:
    build: ./services/lending-service
    ports:
      - "${LENDING_PORT:-8003}:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-library:5432/library_db
      - SCHEMA=lending
    depends_on:
      postgres-library:
        condition: service_healthy
    networks:
      - lib-net

  digital-service:
    build: ./services/digital-service
    ports:
      - "${DIGITAL_PORT:-8004}:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-library:5432/library_db
      - SCHEMA=digital
    depends_on:
      postgres-library:
        condition: service_healthy
    networks:
      - lib-net

networks:
  lib-net:
    driver: bridge

volumes:
  postgres-library-data: