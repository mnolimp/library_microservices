worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    upstream catalog { server catalog-service:8000; }
    upstream user { server user-service:8000; }
    upstream lending { server lending-service:8000; }
    upstream digital { server digital-service:8000; }
    upstream auth { server auth-service:8000; }

    server {
        listen 80;
        server_name localhost;

        # Аутентификация
        location /auth/ {
            proxy_pass http://auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^http://[^/]+/(.*)$ /auth/$1;
        }

        # Явный роут для GitHub OAuth — без trailing slash редиректов
        location = /auth/oauth/github/login {
            proxy_pass http://auth/oauth/github/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /auth/oauth/github/callback {
            proxy_pass http://auth/oauth/github/callback;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Каталог
        location /api/catalog/ {
            proxy_pass http://catalog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Пользователи
        location /api/users/ {
            proxy_pass http://user/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Займы
        location /api/lending/ {
            proxy_pass http://lending/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Цифровые ресурсы
        location /api/digital/ {
            proxy_pass http://digital/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health-check самого шлюза
        location /health {
            access_log off;
            return 200 "gateway: ok\n";
            add_header Content-Type text/plain;
        }
    }
}